name: Agent CLI compatibility

on:
  push:
    branches: [main]
    paths:
      - '.agents/**'
      - '.claude-plugin/**'
      - '.codebuddy-plugin/**'
      - '.github/workflows/cli-compat.yml'
      - 'scripts/**'
      - 'skills/**'
  pull_request:
    paths:
      - '.agents/**'
      - '.claude-plugin/**'
      - '.codebuddy-plugin/**'
      - '.github/workflows/cli-compat.yml'
      - 'scripts/**'
      - 'skills/**'
  schedule:
    - cron: '23 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cli-compat-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  published-install:
    # Runs the README install command verbatim against the published release.
    # Every other install check feeds `skills add` a local path, so none of them
    # notice when installing from the published asset stops working — which is
    # how a package that no user could install shipped for four releases.
    #
    # Scheduled runs only, deliberately. This asks "does the currently published
    # release still install?", which is about the release that is already out,
    # not the candidate being built. A manual dispatch is also how release
    # evidence is produced, and a candidate that fixes a broken published
    # release would be blocked by its own predecessor if this ran there.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'
      - name: Run the published install command end to end
        run: bash scripts/check-install-command.sh --live

  claude-code:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'
      - name: Install current Claude Code CLI
        run: npm install --global @anthropic-ai/claude-code@latest
      - name: Run real Claude Code adapter check
        env:
          CLAUDE_REAL_CHECK: '1'
        run: bash scripts/check-claude-adapter.sh

  codex:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'
      - name: Install current Codex CLI
        run: npm install --global @openai/codex@latest
      - name: Run real Codex CLI discovery test
        run: bash scripts/test-codex-cli-e2e.sh

  opencode:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'
      # OpenCode 2.x 发布在 @opencode/cli；opencode-ai 停在 1.x，本适配不再支持。
      - name: Install current OpenCode 2.x CLI
        run: npm install --global @opencode/cli@latest
      - name: Run real OpenCode CLI adapter test
        run: bash scripts/test-opencode-cli-e2e.sh

  openclaw:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # OpenClaw requires Node 22.19+, 23.11+, or 24+; resolve the latest Node 24
          # patch so openclaw@latest engine requirements are met.
          node-version: 24
          check-latest: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'
      - name: Install current OpenClaw CLI
        run: npm install --global openclaw@latest
      - name: Run real OpenClaw skill discovery test
        env:
          OPENCLAW_REAL_CHECK: '1'
        run: bash scripts/check-openclaw-skills.sh
